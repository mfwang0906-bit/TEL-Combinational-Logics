<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEL of Combinational Logic Circuits</title>
</head>
<body>
  <h1>TEL of Combinational Logic Circuits</h1>
  <button onclick="showTable()">Show 2-to-1 MUX truth table</button>
  <div id="output"></div>

  <script>
    function showTable() {
      let html = "<table border='1'><tr><th>S</th><th>I0</th><th>I1</th><th>Y</th></tr>";
      for (let n = 0; n < 8; n++) {
        const s  = (n >> 2) & 1;
        const i0 = (n >> 1) & 1;
        const i1 = n & 1;
        const y  = s ? i1 : i0;
        html += `<tr><td>${s}</td><td>${i0}</td><td>${i1}</td><td>${y}</td></tr>`;
      }
      html += "</table>";
      document.getElementById("output").innerHTML = html;
    }
  </script>
</body>
</html>
