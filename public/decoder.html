<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decoders &amp; Encoders</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <p><a href="index.html">← Home</a></p>
  <h1>Decoders &amp; Encoders</h1>

   <section class="question">
    <h2>Synthesis</h2>
    <p id="synth-text"></p>
    <div id="synth-table"></div>
    <p>
      Connect outputs Y: <input id="synth-outputs" placeholder="e.g. 1, 3, 5" size="12">
      to a
      <select id="synth-gate">
        <option value="">choose gate</option>
        <option>AND</option>
        <option>OR</option>
        <option>NAND</option>
        <option>NOR</option>
      </select>
      gate.
    </p>
    <button onclick="newSynthesis()">New question</button>
    <button onclick="checkSynthesis()">Check answer</button>
    <button onclick="showSolution()">Show solution</button>
    <p id="synth-feedback"></p>
    <div id="synth-solution" hidden></div>
  </section>

  <section class="question">
    <h2>Analysis</h2>
    <p>A 3-to-8 decoder with active-low outputs has Y0, Y3 and Y5 connected to a 3-input NAND gate, giving output f(a, b, c). Find f in the form Σm(...).</p>
        <svg viewBox="0 0 460 285" width="460" style="max-width:100%; height:auto" role="img"
         aria-label="3-to-8 decoder with active-low outputs Y0, Y3 and Y5 feeding a NAND gate">
      <g stroke="#222" stroke-width="1.5" fill="none">
        <!-- decoder body -->
        <rect x="80" y="20" width="120" height="250"/>
        <!-- input lines -->
        <line x1="30" y1="110" x2="80" y2="110"/>
        <line x1="30" y1="150" x2="80" y2="150"/>
        <line x1="30" y1="190" x2="80" y2="190"/>
        <!-- active-low bubbles on outputs Y0..Y7 -->
        <circle cx="204" cy="40" r="4"/>
        <circle cx="204" cy="70" r="4"/>
        <circle cx="204" cy="100" r="4"/>
        <circle cx="204" cy="130" r="4"/>
        <circle cx="204" cy="160" r="4"/>
        <circle cx="204" cy="190" r="4"/>
        <circle cx="204" cy="220" r="4"/>
        <circle cx="204" cy="250" r="4"/>
        <!-- short stubs for unused outputs (Y1, Y2, Y4, Y6, Y7) -->
        <line x1="208" y1="70" x2="230" y2="70"/>
        <line x1="208" y1="100" x2="230" y2="100"/>
        <line x1="208" y1="160" x2="230" y2="160"/>
        <line x1="208" y1="220" x2="230" y2="220"/>
        <line x1="208" y1="250" x2="230" y2="250"/>
        <!-- wires from Y0, Y3, Y5 to the NAND gate -->
        <polyline points="208,40 270,40 270,120 320,120"/>
        <polyline points="208,130 280,130 280,140 320,140"/>
        <polyline points="208,190 290,190 290,160 320,160"/>
        <!-- NAND gate: flat back, curved front, output bubble -->
        <path d="M320,105 L345,105 A35,35 0 0 1 345,175 L320,175 Z"/>
        <circle cx="384" cy="140" r="4"/>
        <line x1="388" y1="140" x2="430" y2="140"/>
      </g>
      <g font-family="Arial, sans-serif" font-size="12" fill="#222">
        <text x="140" y="14" text-anchor="middle">3-to-8 decoder</text>
        <text x="22" y="114" text-anchor="end">a</text>
        <text x="22" y="154" text-anchor="end">b</text>
        <text x="22" y="194" text-anchor="end">c</text>
        <text x="88" y="114">I2</text>
        <text x="88" y="154">I1</text>
        <text x="88" y="194">I0</text>
        <text x="196" y="44" text-anchor="end">Y0</text>
        <text x="196" y="74" text-anchor="end">Y1</text>
        <text x="196" y="104" text-anchor="end">Y2</text>
        <text x="196" y="134" text-anchor="end">Y3</text>
        <text x="196" y="164" text-anchor="end">Y4</text>
        <text x="196" y="194" text-anchor="end">Y5</text>
        <text x="196" y="224" text-anchor="end">Y6</text>
        <text x="196" y="254" text-anchor="end">Y7</text>
        <text x="436" y="144">f</text>
      </g>
    </svg>
    <details><summary>Show answer</summary><p>f(a, b, c) = Σm(0, 3, 5)</p></details>
  </section>

  <script src="js/engine.js"></script>
  <script src="js/decoder.js"></script>
</body>
</html>
